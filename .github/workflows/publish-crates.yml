# Publishes the Rust crates to crates.io with NO STORED CREDENTIAL.
#
# Same reasoning as publish-npm.yml: a token that gets pasted has been
# disclosed, and the fix is to have no token rather than a fresher one.
# crates.io exchanges this workflow's OIDC identity for a SHORT-LIVED token that
# exists only for the length of the job.
#
# THE crates.io SIDE MUST BE REGISTERED FIRST, per crate, at
# crates.io/crates/<name>/settings -> Trusted Publishing: this repository, this
# workflow filename, and (optionally) an environment. Until then the auth step
# fails, which is the correct failure.
name: publish-crates

on:
  push:
    tags:
      - 'apsis-seamwire-v*'
      - 'apsis-perseid-v*'
  workflow_dispatch:
    inputs:
      crate:
        description: which crate to publish
        required: true
        type: choice
        options:
          - rust/seamwire
          - rust/perseid

permissions:
  contents: read
  id-token: write        # REQUIRED - crates.io verifies this, nothing else.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve which crate this run is for
        id: crate
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) dir='${{ inputs.crate }}' ;;
            push)
              case "${GITHUB_REF_NAME}" in
                apsis-seamwire-v*) dir=rust/seamwire ;;
                apsis-perseid-v*)  dir=rust/perseid ;;
                *) echo "::error::tag ${GITHUB_REF_NAME} maps to no crate"; exit 1 ;;
              esac ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "publishing $dir"

      # A crates.io publish is PERMANENT - yankable, never deletable - so the
      # tag and the manifest agreeing is worth one grep.
      - name: Tag and manifest must agree
        if: github.event_name == 'push'
        working-directory: ${{ steps.crate.outputs.dir }}
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          tagged="${GITHUB_REF_NAME##*-v}"
          echo "manifest=$manifest tag=$tagged"
          [ "$manifest" = "$tagged" ] || {
            echo "::error::tag says $tagged, Cargo.toml says $manifest"; exit 1; }

      - name: Verify before publishing anything permanent
        working-directory: ${{ steps.crate.outputs.dir }}
        run: |
          cargo build
          cargo test

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        working-directory: ${{ steps.crate.outputs.dir }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
