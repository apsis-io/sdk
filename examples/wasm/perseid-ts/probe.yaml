# Build and publish first:
#   ./build.sh
#   apsis ingest -n probe:v3 perseid-probe.wasm
#
# ═══════════════════════════════════════════════════════════════════════════
# THE MEASURING HALF OF THE METRIC GATE (engi, 2026-09-05: "one perseid do
# metrics and writes them as data on itself, another reads them").
#
# It watches `canary-candidate` and publishes a rolling availability measurement
# on ITS OWN `status.carry`. A second program reads that - `observe` of this
# Perseid's path, gated by `perseid:reconcile/observe-perseids@0.1.0` - and
# decides. Two programs, because "who measured" and "who acted" should be
# separately answerable.
#
# ***THERE IS NO `writes:` LIST, AND ITS ABSENCE IS THE POINT.*** A probe changes
# nothing in the cluster. Its only output is its own status, which rides on the
# outcome and needs no write grant at all, so the empty write set makes
# "measures, never acts" enforceable rather than a convention.
#
# ⚠ `perseid:reconcile/carry@0.1.0` IS WHAT MAKES THIS PROGRAM POSSIBLE. It is
# the host handing back what the last pass remembered. Every other Perseid here
# is a total step that re-derives from the present world; an average over time is
# not a function of the present, so without this import the window would be empty
# on every pass and the measurement would never accumulate.
#
# It requires a trail that SERVES that interface (13792d082 or later). An older
# host admits this program and then fails it at first instantiation with "missing
# import" - which is what `ci/wit-skew.sh` checks before you ingest, and what
# build.sh step 6 runs against this host's own binary.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: radiant.apsis/v1
kind: Perseid
metadata:
  name: probe-demo
  namespace: default
spec:
  component: probe:v3
  # The expression language this program's SDK emits (sdk/ts LANGUAGE_VERSION).
  language: 5
  # ⚠ ***THE ARTIFACT'S CLOSURE, NOT THE PROGRAM'S DEMAND, AND THEY ARE NOT THE
  # SAME LIST.*** `derived/probe-step.wit` says three imports - what the step can
  # actually perform. This says forty-three, because `world perseid-ts-probe`
  # includes `wasi:cli/command` and admission compares against what
  # `trail --inspect` reports the ARTIFACT asks for. The README records the same
  # surprise for podmaker: "derive-wit says two and trail --inspect says three,
  # and both are right".
  #
  # Generated from `trail --inspect perseid-probe.wasm`; a hand-written list is
  # refused with a message naming every id it missed, which is how this one was
  # produced.
  imports:
    - perseid:reconcile/carry@0.1.0
    - perseid:reconcile/observe@0.1.0
    - perseid:reconcile/status@0.1.0
    - perseid:reconcile/types@0.1.0
    - wasi:cli/environment@0.2.12
    - wasi:cli/environment@0.3.0
    - wasi:cli/exit@0.2.12
    - wasi:cli/exit@0.3.0
    - wasi:cli/stderr@0.2.12
    - wasi:cli/stderr@0.3.0
    - wasi:cli/stdin@0.2.12
    - wasi:cli/stdin@0.3.0
    - wasi:cli/stdout@0.2.12
    - wasi:cli/stdout@0.3.0
    - wasi:cli/terminal-input@0.2.12
    - wasi:cli/terminal-input@0.3.0
    - wasi:cli/terminal-output@0.2.12
    - wasi:cli/terminal-output@0.3.0
    - wasi:cli/terminal-stderr@0.2.12
    - wasi:cli/terminal-stderr@0.3.0
    - wasi:cli/terminal-stdin@0.2.12
    - wasi:cli/terminal-stdin@0.3.0
    - wasi:cli/terminal-stdout@0.2.12
    - wasi:cli/terminal-stdout@0.3.0
    - wasi:cli/types@0.3.0
    - wasi:clocks/monotonic-clock@0.2.12
    - wasi:clocks/monotonic-clock@0.3.0
    - wasi:clocks/system-clock@0.3.0
    - wasi:clocks/types@0.3.0
    - wasi:clocks/wall-clock@0.2.12
    - wasi:filesystem/preopens@0.2.12
    - wasi:filesystem/preopens@0.3.0
    - wasi:filesystem/types@0.2.12
    - wasi:filesystem/types@0.3.0
    - wasi:io/error@0.2.12
    - wasi:io/poll@0.2.12
    - wasi:io/streams@0.2.12
    - wasi:random/insecure-seed@0.2.12
    - wasi:random/insecure-seed@0.3.0
    - wasi:random/insecure@0.3.0
    - wasi:random/random@0.3.0
    - wasi:sockets/ip-name-lookup@0.3.0
    - wasi:sockets/types@0.3.0
  # The GATED subset: everything admission actually decides about. The rest of
  # the closure above is ambient WASI that `wasi:cli/command` drags in - notably
  # `wasi:sockets`, which every dwarf-built component imports and which the step
  # linker answers with `Network::None`, so it is granted here and unusable at
  # the call.
  capabilities:
    - perseid:reconcile/carry@0.1.0
    - perseid:reconcile/observe@0.1.0
    - perseid:reconcile/status@0.1.0
    - perseid:reconcile/types@0.1.0
    - wasi:sockets/ip-name-lookup@0.3.0
    - wasi:sockets/types@0.3.0
