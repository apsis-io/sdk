# Build and publish first:
#   ./build.sh
#   apsis ingest ./perseid-dag.wasm --name dag:vN
#      (derive N from `apsis images` - an existing tag is OVERWRITTEN silently)
#
# ═══════════════════════════════════════════════════════════════════════════
# THE DAG: staged rollout, one stage at a time.
#
# It brings `dag-a` and `dag-b` to their declared replica counts in order, and
# parks between stages on the condition that says the current one has landed.
#
# ═══════════════════════════════════════════════════════════════════════════
# ⚠ ***THIS FILE WAS RECONSTRUCTED FROM THE LIVE OBJECT ON 2026-09-07, AND THE
# GAP HAD A COST.***
#
# `dag-demo` has run on this cluster for over a week with NO manifest in the
# tree. It was applied once - the object still carries the proof, in
# `kubectl.kubernetes.io/last-applied-configuration`, naming `dag:v2` and a
# `perseid:reconcile/workloads@0.1.0` capability it no longer has - and every
# change since was a `kubectl patch` nobody could review.
#
# ⛔ ***WHAT THE GAP ACTUALLY BROKE:*** `build.sh`'s language-stamp check reads
# "every Perseid YAML declares the SDK's LANGUAGE_VERSION" - over the YAMLs that
# EXIST. With no file there was nothing to check, and `spec.language` sat at 2
# while the SDK went to 4. A gate that iterates a directory cannot see an absence,
# and this is what that looks like after eight days.
#
# ⇒ The content below is the LIVE SPEC, not the last-applied annotation: the two
# had diverged, and the live object is what is actually running.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: radiant.apsis/v1
kind: Perseid
metadata:
  name: dag-demo
  namespace: default
spec:
  component: dag:v6
  # The expression language this program's SDK emits (sdk/ts LANGUAGE_VERSION).
  #
  # ⛔ ***THIS OBJECT SAID 2 UNTIL 2026-09-07, AND THAT WAS AN UNDERSTATEMENT IN
  # THE DANGEROUS DIRECTION.*** It ran for over a week on an artifact built by a
  # v4 SDK while claiming v2, because with no manifest in the tree `build.sh`'s
  # stamp check had nothing to read.
  #
  # ⚠ ***THE STAMP IS THE SDK'S VERSION, NOT AN ANALYSIS OF WHAT THIS PROGRAM
  # EMITS.*** That distinction is worth stating because the other reading is
  # tempting and wrong: this program's live park is plain `Get(p, f) != v` with
  # no v3 selector and no v4 quantifier, so "2 is accurate" looks defensible.
  #
  # It is not, and the reason is that ***AN AUTHOR CANNOT RELIABLY KNOW WHICH
  # CONSTRUCTS THEIR BUILDERS EMIT.*** `anyFieldNe` renders `.min`/`.max`; a
  # program that adopts it moves to v4 without a line of the step changing. The
  # stamp is a deliberate OVER-approximation, and understating it is what gets a
  # program admitted by a radiant that cannot evaluate its park - failing at
  # first park with "unknown symbol" instead of being refused before a pod.
  #
  # Admission says so in its own words: "the program was BUILT WITH A NEWER SDK
  # than the radiant evaluating it".
  language: 5
  # What this program may call. There is no `spec.imports` here and that is not an
  # omission: admission derives the closure from the artifact itself and reports
  # `importSourcing: artifact-verified`, which is what this object shows live.
  # The other manifests declare it as well; both paths verify.
  #
  # ⚠ ***THE ORDER IS THE LIVE ORDER, DELIBERATELY.*** `ensure` sits after the
  # wasi entries rather than with its siblings because it was APPENDED by a later
  # `kubectl patch` - the shape a hand-edited object takes. Keeping it makes
  # `kubectl diff -f dag.yaml` empty, which is the evidence that this file
  # reproduces what is running rather than something close to it. Tidy it in a
  # commit that says so, not in this one.
  capabilities:
    - perseid:reconcile/types@0.1.0
    - perseid:reconcile/observe@0.1.0
    - perseid:reconcile/status@0.1.0
    - wasi:sockets/ip-name-lookup@0.3.0
    - wasi:sockets/types@0.3.0
    - perseid:reconcile/ensure@0.1.0
  # ***THE EXACT OBJECTS THIS PROGRAM MAY WRITE, ONE PATH EACH.*** `spec.writes`
  # matches a canonical object path EXACTLY - that is what lets admission prove no
  # two Perseids claim the same object, and why a runtime-derived name cannot be
  # written without being declared here first.
  writes:
    - /apis/apps/v1/namespaces/default/deployments/dag-a
    - /apis/apps/v1/namespaces/default/deployments/dag-b
