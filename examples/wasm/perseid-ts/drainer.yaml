# Build and publish first:
#   ./build.sh
#   apsis ingest -n drainer:v6 perseid-drainer.wasm
#
# ═══════════════════════════════════════════════════════════════════════════
# THE FIRST PERSEID THAT WRITES A CLUSTER-SCOPED OBJECT.
#
# It cordons a Node and scales its DECLARED workloads off it, then reverses both
# when the drain annotation is withdrawn. Ask for a drain with:
#
#   kubectl annotate node engix99-trail-2 drain.apsis/requested=true
#   kubectl annotate node engix99-trail-2 drain.apsis/requested-       # undo
#
# ⚠ ***THE NODE IS IN BOTH `reads` AND `writes`, AND THEY ARE DIFFERENT
# AUTHORITIES.*** `observe-cluster` confers the cluster READ verb and `spec.reads`
# names which object; the cluster WRITE has no interface of its own (`ensure`
# covers both scopes on one symbol) so `spec.writes` is its ONLY bound. Remove
# the node from `writes` and the cordon is refused with "is not named in this
# program's cluster-scoped writes" - which is the whole boundary, working.
#
# ⛔ ***IT DOES NOT EVICT PODS AND CANNOT - BECAUSE OF `writes` BELOW, NOT
# BECAUSE IT CANNOT SEE THEM.*** This comment said the opposite until 03450311c
# landed a collection read; the step now enumerates the pods on the node and
# NAMES the ones blocking a drain in its Ready condition.
#
# It still may not move one. `spec.writes` matches an object path EXACTLY, so a
# pod discovered at runtime was never declared - and could not have been, since
# its name carries a rollout-random suffix. That bound is what makes admission's
# WriteConflicts able to prove no two Perseids claim the same object, so relaxing
# it here would cost every other program its exclusivity guarantee. The unit of
# draining is therefore a declared workload. See src/drainer.ts's header.
#
# ⭐ The pod enumeration needs NO new capability: `observe` already confers
# `pods:read`, and a collection read is bounded by that plus the grant's
# namespace. `spec.reads` is not consulted for collections - it exists for
# CLUSTER-scoped objects, which have no namespace to bound them.
#
# ⭐ A drain request is noticed in ~130ms. It used to be up to 60s: a
# cluster-scoped subject could not be wake-indexed, so the trigger fell to the
# backstop poll. Three changes on 2026-09-05 fixed that and it took all three -
# the index grew a cluster arm bounded by `spec.reads`, radiant grew a node
# informer to feed it, and `Get` learned to READ a cluster path so the condition
# can evaluate at all. Measured on this node, both directions, with radiant's own
# log naming the mechanism rather than inferring it from timing:
#
#   annotation SET      128ms   "condition became true (via the wake index)"
#   annotation DELETED  125ms   same, on the `!exists` half
#   before, same program        "backstop elapsed (via poll, NOT the index)"
#
# ⚠ The DELETION case is the one worth knowing about: withdrawal removes the
# field, an absent operand compares UNKNOWN, so a park written as a plain `!=`
# would not have fired at all and this program would have sat cordoned until its
# backstop. See `fieldNoLonger` in src/drainer.ts.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: radiant.apsis/v1
kind: Perseid
metadata:
  name: drainer-demo
  namespace: default
spec:
  # v7: the six `deadline(Date.now() + RECHECK_MS)` park operands became
  # `backstop()`. ***NO BEHAVIOUR CHANGE*** - this program declares 45s
  # (`drainer-backstop.ts`) and the host takes the MINIMUM of the declared bound
  # and its flag, so a 60s operand could never fire first. That file had said so
  # in its own doc since it was written. Artifact still carries
  # `perseid:backstop{"ms":45000}`, verified after the rebuild.
  component: drainer:v7
  # The expression language this program's SDK emits (sdk/ts LANGUAGE_VERSION).
  language: 5
  # The ARTIFACT's closure, from `trail --inspect perseid-drainer.wasm` - not the
  # program's demand (4, in derived/drainer-step.wit). Admission compares against
  # the artifact.
  imports:
    - perseid:reconcile/ensure@0.1.0
    - perseid:reconcile/observe-cluster@0.1.0
    - perseid:reconcile/observe@0.1.0
    - perseid:reconcile/status@0.1.0
    - perseid:reconcile/types@0.1.0
    - wasi:cli/environment@0.2.12
    - wasi:cli/environment@0.3.0
    - wasi:cli/exit@0.2.12
    - wasi:cli/exit@0.3.0
    - wasi:cli/stderr@0.2.12
    - wasi:cli/stderr@0.3.0
    - wasi:cli/stdin@0.2.12
    - wasi:cli/stdin@0.3.0
    - wasi:cli/stdout@0.2.12
    - wasi:cli/stdout@0.3.0
    - wasi:cli/terminal-input@0.2.12
    - wasi:cli/terminal-input@0.3.0
    - wasi:cli/terminal-output@0.2.12
    - wasi:cli/terminal-output@0.3.0
    - wasi:cli/terminal-stderr@0.2.12
    - wasi:cli/terminal-stderr@0.3.0
    - wasi:cli/terminal-stdin@0.2.12
    - wasi:cli/terminal-stdin@0.3.0
    - wasi:cli/terminal-stdout@0.2.12
    - wasi:cli/terminal-stdout@0.3.0
    - wasi:cli/types@0.3.0
    - wasi:clocks/monotonic-clock@0.2.12
    - wasi:clocks/monotonic-clock@0.3.0
    - wasi:clocks/system-clock@0.3.0
    - wasi:clocks/types@0.3.0
    - wasi:clocks/wall-clock@0.2.12
    - wasi:filesystem/preopens@0.2.12
    - wasi:filesystem/preopens@0.3.0
    - wasi:filesystem/types@0.2.12
    - wasi:filesystem/types@0.3.0
    - wasi:io/error@0.2.12
    - wasi:io/poll@0.2.12
    - wasi:io/streams@0.2.12
    - wasi:random/insecure-seed@0.2.12
    - wasi:random/insecure-seed@0.3.0
    - wasi:random/insecure@0.3.0
    - wasi:random/random@0.3.0
    - wasi:sockets/ip-name-lookup@0.3.0
    - wasi:sockets/types@0.3.0
  capabilities:
    - perseid:reconcile/ensure@0.1.0
    - perseid:reconcile/observe-cluster@0.1.0
    - perseid:reconcile/observe@0.1.0
    - perseid:reconcile/status@0.1.0
    - perseid:reconcile/types@0.1.0
    - wasi:sockets/ip-name-lookup@0.3.0
    - wasi:sockets/types@0.3.0
  # The cluster-scoped READ, per object. `observe-cluster` confers the verb; this
  # names the one machine this program may look at.
  reads:
    - /api/v1/nodes/engix99-trail-2
  # ⭐ THE NODE IS HERE BECAUSE `spec.writes` IS THE ONLY THING BOUNDING A
  # CLUSTER-SCOPED WRITE. The deployment entry is bounded by the namespace as
  # well; this one is not, so this line is the entire authority for cordoning.
  writes:
    - /api/v1/nodes/engix99-trail-2
    - /apis/apps/v1/namespaces/default/deployments/drain-demo
